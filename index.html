<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivos en Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de cuaderno (máx. 920px) con pestañas fijas arriba; en "Aprende", índice de lecciones a la izquierda en pantallas anchas.
   Motivo: la cuadrícula de la matriz; el resaltador amarillo marca la celda que se está mirando y el azul de bolígrafo es el acento. */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --ink:#1b2130; --muted:#5b6578; --line:#dce1ea; --soft:#eef1f6; --out:#e7ebf2;
  --accent:#2f4fd1; --accent-ink:#ffffff; --accent-soft:#e7ecff;
  --mark:#ffd84a; --mark-soft:#fff3bf; --mark-ink:#1b2130;
  --ok:#17804a; --ok-soft:#ddf2e6; --bad:#c23b2b; --bad-soft:#fbe4e0;
  --kw:#7b3fc4; --str:#16794a; --num:#b4530f; --com:#8a93a6;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#181c26; --ink:#e8ebf3; --muted:#9ca5b8; --line:#2c3344; --soft:#1f2431; --out:#262c3b;
  --accent:#8fa2ff; --accent-ink:#11141b; --accent-soft:#232b4e;
  --mark:#f2cd3f; --mark-soft:#3a3418; --mark-ink:#1b2130;
  --ok:#52c98b; --ok-soft:#153021; --bad:#ff8b7b; --bad-soft:#3b1e1a;
  --kw:#c39bff; --str:#7bd6a4; --num:#f5a66c; --com:#7d869a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#181c26; --ink:#e8ebf3; --muted:#9ca5b8; --line:#2c3344; --soft:#1f2431; --out:#262c3b;
  --accent:#8fa2ff; --accent-ink:#11141b; --accent-soft:#232b4e;
  --mark:#f2cd3f; --mark-soft:#3a3418; --mark-ink:#1b2130;
  --ok:#52c98b; --ok-soft:#153021; --bad:#ff8b7b; --bad-soft:#3b1e1a;
  --kw:#c39bff; --str:#7bd6a4; --num:#f5a66c; --com:#7d869a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:.04em .32em;overflow-wrap:anywhere}
strong{font-weight:700}

.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{display:grid;grid-template-columns:repeat(3,8px);gap:2px;flex:none}
.logo i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.logo i.on{background:var(--mark)}
.marca h1{font-size:1.2rem}
.marca p{font-size:.8rem;color:var(--muted);line-height:1.3}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:700;font-size:.95rem}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

main{padding-block:28px 64px}
.intro{display:grid;gap:6px;margin-bottom:22px;max-width:62ch}
.intro h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.intro p{color:var(--muted)}

/* Aprende */
.aprende{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.indice{min-width:0}
@media (min-width:860px){.aprende{grid-template-columns:220px minmax(0,1fr);align-items:start}.indice{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.indice ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
@media (max-width:859px){.indice ol{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.indice li{flex:none}}
.indice button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 10px;color:var(--muted);font-weight:700;font-size:.95rem}
.indice button .n{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-family:var(--f-display);font-size:.9rem}
.indice button[aria-current="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.indice button[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.indice button.hecho .n{background:var(--ok-soft);color:var(--ok)}
.leccion{min-width:0;display:grid;gap:18px}
.leccion > h2{font-size:clamp(1.5rem,3.6vw,2rem)}
.leccion .eti{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.leccion h3{font-size:1.2rem;margin-top:10px}
.leccion > p,.leccion > ul{max-width:66ch}
.leccion ul{margin:0;padding-left:1.15em;display:grid;gap:6px}

pre.code{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.6;tab-size:4}
pre.code.solo{border-radius:12px}
pre.code code{background:none;border:0;padding:0;font-size:inherit}
.k{color:var(--kw);font-weight:600}.s{color:var(--str)}.nu{color:var(--num)}.c{color:var(--com);font-style:italic}
.bloque-code{display:grid;min-width:0}
.bloque-code .tit{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.usa{font-weight:400;font-size:.85rem;color:var(--muted)}
.salida{background:var(--out);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:8px 14px 10px;min-width:0}
.salida .lab{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.salida pre{margin:2px 0 0;font-family:var(--f-mono);font-size:.84rem;line-height:1.55;white-space:pre;overflow-x:auto}
.ojo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--mark-soft);border-radius:12px;padding:12px 14px;max-width:70ch}
.ojo b{font-family:var(--f-display);font-size:.95rem}
.ojo .ic{width:22px;height:22px;border-radius:6px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.tabla{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tabla table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:560px}
.tabla th,.tabla td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla tr:last-child td{border-bottom:0}
.tabla th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nota{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:14px 16px;display:grid;gap:10px;max-width:70ch}
.formula{display:flex;justify-content:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-family:"Times New Roman",Georgia,serif;font-size:1.35rem;overflow-x:auto}
.formula .raiz{display:inline-flex;align-items:stretch}
.formula .sig{font-size:2.2rem;line-height:1;align-self:center}
.formula .bajo{border-top:2px solid var(--ink);display:inline-flex;align-items:center;padding:4px 6px 0}
.formula .frac{display:inline-grid;text-align:center;margin:0 4px}
.formula .frac span:first-child{border-bottom:1.5px solid var(--ink);padding:0 6px 2px}
.formula sub,.formula sup{font-size:.6em}

/* widgets */
.widget{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.widget .wt{font-family:var(--f-display);font-size:1.02rem}
.widget .ayuda{font-size:.9rem;color:var(--muted)}
.fila-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--accent-ink)}
.btn.chico{padding:6px 12px;font-size:.9rem}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.lectura{font-family:var(--f-mono);font-size:.92rem;background:var(--soft);border-radius:10px;padding:10px 12px;min-height:2.6em;overflow-wrap:anywhere}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.vars span{font-family:var(--f-mono);font-size:.88rem;background:var(--soft);border-radius:8px;padding:4px 10px}
.vars b{color:var(--accent)}

.matriz{display:inline-grid;gap:4px;font-variant-numeric:tabular-nums;max-width:100%}
.matriz .lbl{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:grid;place-items:center;border:0;background:none;padding:0;min-height:22px}
button.lbl:hover{color:var(--accent)}
.matriz .lbl.on{color:var(--accent);font-weight:700}
.celda{width:clamp(36px,9vw,52px);height:clamp(36px,9vw,52px);border:1.5px solid var(--line);border-radius:9px;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:clamp(.8rem,2.6vw,.98rem);color:var(--ink);padding:0;transition:background .15s,border-color .15s,transform .1s}
button.celda:hover{border-color:var(--accent)}
.celda.tinte{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.celda.visto{background:var(--soft);color:var(--muted)}
.celda.sel{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.celda.max{outline:2px solid var(--accent);outline-offset:1px}
.celda.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.celda.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:sacude .3s}
.celda.vacia{color:transparent}
.celda.pista{border-color:var(--mark);border-style:dashed}
@keyframes sacude{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ecu{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ecu .op{font-family:var(--f-display);font-size:1.5rem;color:var(--muted)}
.ecu figure{margin:0;display:grid;gap:4px;justify-items:center}
.ecu figcaption{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

.notas-t{overflow-x:auto}
.notas-t table{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.88rem}
.notas-t th,.notas-t td{padding:6px 9px;border-radius:7px;text-align:right;white-space:nowrap}
.notas-t th{font-family:var(--f-body);font-size:.8rem;color:var(--muted)}
.notas-t th button,.notas-t td button{border:0;background:none;padding:0;font:inherit;color:inherit}
.notas-t td.n{background:var(--soft)}
.notas-t td.res{color:var(--accent);font-weight:600}
.notas-t .on{background:var(--mark)!important;color:var(--mark-ink)!important}
.notas-t .tin{background:var(--mark-soft)!important}
.tira{display:flex;flex-wrap:wrap;gap:3px}.tira .ch{display:grid;justify-items:center;min-width:26px;border:1.5px solid var(--line);border-radius:7px;padding:3px 2px;background:var(--surface)}.tira .ch b{font-family:var(--f-mono);font-size:1rem}.tira .ch i{font-style:normal;font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}.tira .ch.on{background:var(--mark);border-color:var(--mark)}.tira .ch.on b,.tira .ch.on i{color:var(--mark-ink)}
.barras{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;align-items:end;height:120px}
.barras div{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.barras-eje{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);text-align:center}

/* preguntas */
.preg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.preg .q{font-weight:700}
.ops{display:grid;gap:8px}
.ops.salidas{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.op-b{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}
.op-b:hover:not(:disabled){border-color:var(--accent)}
.op-b[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.op-b.ok{border-color:var(--ok);background:var(--ok-soft)}
.op-b.bad{border-color:var(--bad);background:var(--bad-soft)}
.op-b:disabled{cursor:default}
.op-b .v{min-width:0}
.op-b .v.mono{font-family:var(--f-mono);font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere}
.fichas{display:flex;flex-wrap:wrap;gap:8px}
.ficha{font-family:var(--f-mono);font-size:.9rem;font-weight:600;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:7px 12px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.ficha[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hueco{display:inline-block;min-width:3em;padding:0 .35em;border-bottom:2.5px solid var(--accent);background:var(--accent-soft);border-radius:5px 5px 0 0;text-align:center}
.hueco.vacio{color:transparent}
.hueco.ok{border-color:var(--ok);background:var(--ok-soft)}
.hueco.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:11px;padding:10px 12px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb h4{font-size:1rem}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb pre{margin:0;font-family:var(--f-mono);font-size:.84rem;background:var(--surface);border-radius:8px;padding:6px 10px;overflow-x:auto}
.zona-t{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prog,.banco{display:grid;gap:6px;min-height:44px;padding:8px;border-radius:11px}
.prog{background:var(--soft);border:1.5px dashed var(--line)}
.banco{border:1px solid var(--line)}
.blq{display:flex;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-family:var(--f-mono);font-size:.8rem}
.blq .ind{flex:none;align-self:stretch;width:calc(var(--n) * 1.1em);background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 1.1em)}
.blq .bt{min-width:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.blq.ok{border-color:var(--ok)}.blq.bad{border-color:var(--bad);background:var(--bad-soft)}
.vacio-t{color:var(--muted);font-size:.88rem}
.chequeo{display:grid;gap:12px}
.navlec{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}

/* juegos y examen */
.tarjetas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tarj{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tarj:hover{border-color:var(--accent)}
.tarj h3{font-size:1.1rem}
.tarj p{font-size:.92rem;color:var(--muted)}
.tarj .rec{font-size:.82rem;color:var(--accent);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(4,10px);gap:2px}
.mini i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--mark)}.mini i.az{background:var(--accent)}
.juego{display:grid;gap:16px;justify-items:start}
.juego > *{max-width:100%}
.marcador{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.marcador .pill{font-size:.85rem;font-weight:700;background:var(--soft);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.marcador .esp{margin-left:auto}
.consigna{font-family:var(--f-display);font-size:1.25rem}
.consigna code{font-size:.95em}
.barra{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;width:100%}
.barra i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.final{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;justify-items:start;width:100%}
.final .grande{font-family:var(--f-display);font-size:3rem;line-height:1}
.final .grande small{font-size:1.2rem;color:var(--muted)}
.ejercicios{display:grid;gap:12px;margin-top:34px}
.ejer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.ejer .fu{font-size:.8rem;color:var(--muted);font-weight:700}
.ejer details summary{cursor:pointer;font-weight:700;color:var(--accent)}
.ejer details > div{margin-top:8px;display:grid;gap:8px}
.ejer .esperada{font-family:var(--f-mono);font-size:.84rem;background:var(--out);border-radius:10px;padding:8px 12px;white-space:pre;overflow-x:auto;margin:0}
.copiar{justify-self:start}
.leccion,.preg,.widget,.chequeo,.juego,.ejer,.final,.ejer details > div{grid-template-columns:minmax(0,1fr)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="marca">
      <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div>
      <div><h1>Archivos en Python</h1><p>Clases del 9 y 11 de noviembre · Programación</p></div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button type="button" data-ir="aprende">Aprende</button>
      <button type="button" data-ir="juegos">Juegos</button>
      <button type="button" data-ir="examen">Examen</button>
    </nav>
  </div>
</header>
<main class="wrap" id="vista"></main>

<script>
const DATA = {"lecciones":[{"id":"abrir","titulo":"Abrir y leer un archivo","corto":"Leer un archivo","bloques":[{"tipo":"p","texto":"Un archivo de texto (`.txt`) es como un cuaderno: **una línea debajo de otra**. En clase el archivo traía una línea por estudiante, con su cédula, nombre, apellido y materias."},{"tipo":"p","texto":"Para trabajar con él hay 3 pasos: **abrirlo, leerlo y cerrarlo**. En esta página usamos este archivo de ejemplo, `alumnos.txt`:"},{"tipo":"archivo","nombre":"alumnos.txt","texto":"30474035,Perez,Gil,Ana,Maria,0790\n28999111,Arias,Mora,Luis,Jose,0760\n31000555,Lopez,Rey,Eva,Sofia,0790\n29555222,Diaz,Paz,Juan,Carlos,0790"},{"tipo":"code","code":"f = open(\"alumnos.txt\", \"r\")\nlecturaArchivo = f.readlines()\nfor linea in lecturaArchivo:\n    print(linea.strip())\nf.close()","titulo":"El programa de clase","entrada":"","usa":"","salida":"30474035,Perez,Gil,Ana,Maria,0790\n28999111,Arias,Mora,Luis,Jose,0760\n31000555,Lopez,Rey,Eva,Sofia,0790\n29555222,Diaz,Paz,Juan,Carlos,0790"},{"tipo":"lista","items":["`open(\"alumnos.txt\", \"r\")` abre el archivo. La `\"r\"` es de *read*: solo para leer.","`f.readlines()` lo lee completo y lo devuelve como una **lista de líneas**.","El `for` pasa por cada línea, una por una.","`f.close()` lo cierra al terminar."]},{"tipo":"h","texto":"try y except: por si algo sale mal"},{"tipo":"p","texto":"Si el nombre del archivo está mal escrito, Python da error y el programa se cae. Con `try` se **intenta** hacer algo, y si falla, se ejecuta lo del `except` en vez de caerse."},{"tipo":"code","code":"try:\n    f = open(\"alumnos\", \"r\")\n    print(f.readlines())\n    f.close()\nexcept:\n    print(\"hubo problemas\")","titulo":"Tu ejemplo del cuaderno: falta el .txt","entrada":"","usa":"","salida":"hubo problemas"},{"tipo":"ojo","texto":"Ese fue el «¿por qué hubo problemas?» de tu cuaderno: el nombre del archivo no estaba completo, le faltaba el `.txt`. El nombre tiene que ser exacto."}],"chequeo":[{"t":"elige","q":"¿Qué devuelve `f.readlines()`?","ops":["Una lista con las líneas del archivo","Solo la primera línea","Un número"],"exp":"Cada elemento de la lista es una línea del archivo.","code":null},{"t":"elige","q":"Si el archivo no existe, ¿qué hace el programa con `try` y `except`?","ops":["Muestra el mensaje del except","Se cae con error","No hace nada"],"exp":"Lo del `try` falla y Python pasa al `except`.","code":null}]},{"id":"cortar","titulo":"Cortar un texto: los corchetes","corto":"Cortar textos","bloques":[{"tipo":"p","texto":"Cada línea es un **texto**, y cada letra o número del texto tiene una **posición**, contando desde 0 (igual que en las listas y matrices)."},{"tipo":"widget","w":"slicing"},{"tipo":"p","texto":"Con los corchetes **cortas un pedazo**, como con tijera:"},{"tipo":"code","code":"a = \"esto es una prueba\"\nprint(a[:4])\nprint(a[3:8])\nprint(a[8:])","titulo":"El ejemplo de clase","entrada":"","usa":"","salida":"esto\no es\nuna prueba"},{"tipo":"lista","items":["`a[3:8]`: desde la posición 3 **hasta antes de la 8**. El segundo número no se incluye, así que salen 8 − 3 = 5 caracteres.","`a[:4]`: sin el primer número es **desde el principio**. Son los primeros 4.","`a[8:]`: sin el segundo número es **hasta el final**."]},{"tipo":"h","texto":"La cédula: linea[41:49]"},{"tipo":"p","texto":"En el archivo del profe cada dato está siempre en el mismo sitio de la línea. La cédula empieza en la posición 41 y tiene 8 números, por eso es `linea[41:49]`: **41 + 8 = 49**."},{"tipo":"h","texto":"Números negativos: desde el final"},{"tipo":"p","texto":"Un número negativo cuenta **desde el final**: `-1` es el último, `-2` el penúltimo. Entonces `[-4:]` es **los últimos 4**."},{"tipo":"code","code":"dato = \"SEC01-0790\"\nprint(dato[-1])\nprint(dato[-4:])","titulo":"Lo que hizo el profe con el código de la materia","entrada":"","usa":"","salida":"0\n0790"},{"tipo":"ojo","texto":"En la computadora escribiste `a[:3:8]`, con dos puntos al principio. Eso significa otra cosa y da solo `e`. Es `a[3:8]`, como en tu cuaderno."}],"chequeo":[{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"t = \"programacion\"\nprint(t[:7])","ops":["program a","programa","rogram"],"exp":"Los primeros 7 caracteres: posiciones 0 a 6.","correcta":"program"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"t = \"cedula30474035\"\nprint(t[-8:])","ops":["cedula30","30474035 ","5"],"exp":"Los últimos 8 caracteres: la cédula.","correcta":"30474035"}]},{"id":"strip","titulo":"strip y split","corto":"strip y split","bloques":[{"tipo":"h","texto":"strip(): quitar los espacios de los lados"},{"tipo":"code","code":"a = \"   casa \"\nprint(len(a))\nprint(len(a.strip()))","titulo":"El ejemplo de tu cuaderno","entrada":"","usa":"","salida":"8\n4"},{"tipo":"p","texto":"`strip()` quita los espacios (y el salto de línea) **del principio y del final**, no los del medio. Por eso `\"   casa \"` mide 8 y sin espacios mide 4."},{"tipo":"p","texto":"En clase se usó para saber si en un espacio de la línea **hay una materia o está vacío**: si después de quitar los espacios no queda nada, está vacío."},{"tipo":"code","code":"linea = \"30474035 0790 0760     \"\nprint(len(linea[14:18].strip()) != 0)\nprint(len(linea[19:23].strip()) != 0)","titulo":"¿Hay materia en ese espacio?","entrada":"","usa":"","salida":"True\nFalse"},{"tipo":"h","texto":"split(): partir el texto en una lista"},{"tipo":"p","texto":"`split(\",\")` corta el texto **cada vez que encuentra una coma** y te da los pedazos en una lista."},{"tipo":"code","code":"palabra = \"asignatura,0760,01\"\na = palabra.split(\",\")\nprint(a)\nprint(a[0])\nprint(a[1])","titulo":"El ejemplo de tu cuaderno (revisar)","entrada":"","usa":"","salida":"['asignatura', '0760', '01']\nasignatura\n0760"},{"tipo":"ojo","texto":"Si el texto tiene espacios después de la coma (`\"asignatura, 0760, 01\"`), los pedazos quedan con el espacio: `' 0760'`. Y `split(\"|\")` hace lo mismo pero cortando donde hay `|`."}],"chequeo":[{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"partes = \"30474035,Perez,Ana\".split(\",\")\nprint(partes[1])","ops":["30474035","Perez,Ana","Ana"],"exp":"partes queda `['30474035', 'Perez', 'Ana']` y la posición 1 es Perez.","correcta":"Perez"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(len(\"  hola  \".strip()))","ops":["8","6","2"],"exp":"Sin los espacios de los lados queda `hola`: 4 letras.","correcta":"4"}]},{"id":"buscar","titulo":"Buscar en el archivo","corto":"Buscar","bloques":[{"tipo":"p","texto":"Ya con eso se puede buscar. La idea: **leer línea por línea, partirla, y si el dato coincide, guardarlo** en una lista con `append`."},{"tipo":"code","code":"cedula = \"30474035\"\ntry:\n    f = open(\"alumnos.txt\", \"r\")\n    for linea in f.readlines():\n        if cedula == linea[0:8]:\n            print(linea.strip())\n    f.close()\nexcept:\n    print(\"hubo problemas\")","titulo":"9-11: buscar la línea de una cédula","entrada":"","usa":"","salida":"30474035,Perez,Gil,Ana,Maria,0790"},{"tipo":"p","texto":"Clase del 11-11: te dan el **código de una materia** y hay que sacar la lista de todos los que la inscribieron. Cada persona se guarda en tres listas: cédulas, nombres y apellidos."},{"tipo":"code","code":"codigo = \"0790\"\ncedulas = []\nnombres = []\napellidos = []\ntry:\n    f = open(\"alumnos.txt\", \"r\")\n    lecturaArchivo = f.readlines()\n    for linea in lecturaArchivo:\n        partes = linea.strip().split(\",\")\n        if partes[5][-4:] == codigo:\n            cedulas.append(partes[0])\n            nombres.append(partes[3] + \" \" + partes[4])\n            apellidos.append(partes[1] + \" \" + partes[2])\n    f.close()\nexcept:\n    print(\"hubo problemas\")\n\nprint(apellidos)\nprint(nombres)\nprint(cedulas)","titulo":"11-11: todos los de la materia 0790","entrada":"","usa":"","salida":"['Perez Gil', 'Lopez Rey', 'Diaz Paz']\n['Ana Maria', 'Eva Sofia', 'Juan Carlos']\n['30474035', '31000555', '29555222']"},{"tipo":"lista","items":["`linea.strip().split(\",\")` quita el salto de línea y parte la línea por las comas.","`partes[5][-4:]` son los últimos 4 caracteres del dato del código.","Si coincide, se agrega la persona a las 3 listas. Fíjate que la **misma posición** en las 3 listas es la misma persona."]},{"tipo":"ojo","texto":"Si el código es lo último de la línea, quítale antes el salto de línea con `strip()`. Si no, `[-4:]` agarra el salto de línea y nunca coincide."}],"chequeo":[{"t":"elige","q":"En las tres listas, `apellidos[2]`, `nombres[2]` y `cedulas[2]`…","ops":["son de la misma persona","son de personas distintas","están vacíos"],"exp":"Se agregaron juntos, en el mismo momento: la misma posición es la misma persona.","code":null},{"t":"elige","q":"¿Para qué se usa `append`?","ops":["Para agregar un elemento al final de la lista","Para abrir el archivo","Para ordenar la lista"],"exp":"Cada persona encontrada se agrega al final.","code":null}]},{"id":"ordenar","titulo":"Ordenar las tres listas juntas","corto":"Ordenar","bloques":[{"tipo":"p","texto":"Esta es la parte que no entendiste. El problema: si ordenas **solo** los apellidos, los nombres y las cédulas se quedan donde estaban y **se mezclan las personas**."},{"tipo":"p","texto":"La solución: cada vez que dos apellidos cambian de puesto, se cambian **los mismos puestos en las otras dos listas**. Así cada persona se mueve completa, como una fila de una tabla."},{"tipo":"widget","w":"ordenar"},{"tipo":"code","code":"def ordenar(lista1, lista2, lista3):\n    for i in range(len(lista1) - 1):\n        for j in range(i + 1, len(lista1)):\n            if lista1[i] > lista1[j]:\n                lista1[i], lista1[j] = lista1[j], lista1[i]\n                lista2[i], lista2[j] = lista2[j], lista2[i]\n                lista3[i], lista3[j] = lista3[j], lista3[i]\n    return lista1, lista2, lista3","titulo":"La función de clase","entrada":"","usa":"","salida":""},{"tipo":"lista","items":["Los dos `for` son el ordenamiento por intercambio de antes: compara cada persona con **todas las que están después**.","Con textos, `>` compara **por orden alfabético**: `\"Gomez\" > \"Arias\"` es verdad porque la G va después de la A. Si está desordenado, se intercambian.","`x, y = y, x` intercambia dos valores en una sola línea.","Ordena según la **primera lista** que le pases. Para ordenar por cédula, pon las cédulas de primera."]},{"tipo":"h","texto":"a, b, c = ordenar(...)"},{"tipo":"p","texto":"La función termina con `return lista1, lista2, lista3`: devuelve **las tres listas juntas**. Y `a, b, c = ...` las recibe **en el mismo orden**: es como abrir un paquete con 3 cosas y ponerle nombre a cada una."},{"tipo":"code","code":"def ordenar(lista1, lista2, lista3):\n    for i in range(len(lista1) - 1):\n        for j in range(i + 1, len(lista1)):\n            if lista1[i] > lista1[j]:\n                lista1[i], lista1[j] = lista1[j], lista1[i]\n                lista2[i], lista2[j] = lista2[j], lista2[i]\n                lista3[i], lista3[j] = lista3[j], lista3[i]\n    return lista1, lista2, lista3\n\napellidos = [\"Perez Gil\", \"Arias Mora\", \"Lopez Rey\"]\nnombres = [\"Ana\", \"Luis\", \"Eva\"]\ncedulas = [\"30474035\", \"28999111\", \"31000555\"]\na, b, c = ordenar(apellidos, nombres, cedulas)\nprint(a)\nprint(b)\nprint(c)","titulo":"Probándola","entrada":"","usa":"","salida":"['Arias Mora', 'Lopez Rey', 'Perez Gil']\n['Luis', 'Eva', 'Ana']\n['28999111', '31000555', '30474035']"},{"tipo":"p","texto":"`a` son los apellidos ya ordenados, `b` los nombres y `c` las cédulas, y cada nombre sigue con su apellido. Si quieres separar por sección, es igual: una **cuarta lista** que también se intercambia."}],"chequeo":[{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"x = 5\ny = 9\nx, y = y, x\nprint(x, y)","ops":["5 9","9 9","5 5"],"exp":"Se intercambian: x queda con 9 y y con 5.","correcta":"9 5"},{"t":"elige","q":"Con `a, b, c = ordenar(apellidos, nombres, cedulas)`, ¿qué es `c`?","ops":["Las cédulas, ya ordenadas junto con su persona","Los apellidos","Un número"],"exp":"Se reciben en el mismo orden en que la función las devuelve.","code":null}]},{"id":"mostrar","titulo":"Mostrar la lista y guardarla","corto":"Mostrar y guardar","bloques":[{"tipo":"h","texto":"ljust(40): columnas derechas"},{"tipo":"p","texto":"`texto.ljust(40)` rellena con espacios a la derecha hasta tener 40 caracteres. Así cada columna empieza en el mismo sitio, aunque los nombres sean de distinto largo."},{"tipo":"code","code":"a = [\"Arias Mora\", \"Lopez Rey\"]\nb = [\"Luis Jose\", \"Eva Sofia\"]\nc = [\"28999111\", \"31000555\"]\nfor i in range(len(a)):\n    print(a[i].ljust(15), b[i].ljust(15), c[i])","titulo":"Uso ljust(15) aquí para que quepa en el teléfono","entrada":"","usa":"","salida":"Arias Mora      Luis Jose       28999111\nLopez Rey       Eva Sofia       31000555"},{"tipo":"h","texto":"Guardar en un archivo nuevo: \"w\""},{"tipo":"p","texto":"Con `\"w\"` (de *write*) el archivo se abre **para escribir**: si no existe lo crea, y si existe lo borra y lo escribe de nuevo. `write` escribe texto, y `\"\\n\"` es el salto de línea, para bajar a la línea siguiente."},{"tipo":"code","code":"m = open(\"listado.txt\", \"w\")\nm.write(\"listado\" + \"\\n\")\nm.write(\"codigo 0790\" + \"\\n\")\nm.write(\"Arias Mora\".ljust(15) + \"Luis Jose\" + \"\\n\")\nm.close()\n\nprint(open(\"listado.txt\").read())","titulo":"Escribir y después leer lo que quedó","entrada":"","usa":"","salida":"listado\ncodigo 0790\nArias Mora     Luis Jose"},{"tipo":"ojo","texto":"Sin el `\"\\n\"` todo queda pegado en una sola línea. Y no olvides el `close()`: a veces lo escrito no se guarda hasta que se cierra."}],"chequeo":[{"t":"elige","q":"¿Qué hace `open(\"lista.txt\", \"w\")`?","ops":["Abre el archivo para escribir (lo crea o lo borra y empieza de nuevo)","Lo abre solo para leer","Lo borra del computador"],"exp":"`\"r\"` es leer y `\"w\"` es escribir.","code":null},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(\"Ana\".ljust(6) + \"|\")","ops":["Ana|","   Ana|","Ana      |"],"exp":"Ana tiene 3 letras: se agregan 3 espacios hasta llegar a 6.","correcta":"Ana   |"}]}],"examen":[{"t":"elige","q":"¿Qué letra se usa en `open` para **leer** un archivo?","ops":["\"r\"","\"w\"","\"l\""],"exp":"r de read. La w es para escribir.","code":null},{"t":"elige","q":"¿Qué hace `readlines()`?","ops":["Devuelve una lista con todas las líneas","Lee solo una línea","Escribe en el archivo"],"exp":"Cada línea es un elemento de la lista.","code":null},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"a = \"esto es una prueba\"\nprint(a[:4])","ops":["esto ","est","o es"],"exp":"Desde el principio hasta antes de la posición 4.","correcta":"esto"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"a = \"esto es una prueba\"\nprint(a[8:11])","ops":["una ","na p","s un"],"exp":"Posiciones 8, 9 y 10: `una`.","correcta":"una"},{"t":"elige","q":"Una cédula empieza en la posición 41 y tiene 8 números. ¿Cómo se corta?","ops":["`linea[41:49]`","`linea[41:48]`","`linea[41:8]`"],"exp":"El segundo número no se incluye: 41 + 8 = 49.","code":null},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"dato = \"SEC02-0760\"\nprint(dato[-4:])","ops":["SEC0","-0760","0"],"exp":"Los últimos 4 caracteres.","correcta":"0760"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(len(\" programa \".strip()))","ops":["10","9","7"],"exp":"Sin los espacios de los lados queda `programa`: 8 letras.","correcta":"8"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"partes = \"Diaz,Paz,Juan\".split(\",\")\nprint(partes[2])","ops":["Paz","Diaz,Paz,Juan","Diaz"],"exp":"La lista es `['Diaz', 'Paz', 'Juan']` y la posición 2 es Juan.","correcta":"Juan"},{"t":"completa","q":"Completa para agregar la cédula a la lista.","code":"cedulas = []\ncedulas.___(\"30474035\")\nprint(cedulas)","ops":["append","add","write"],"exp":"Las listas se llenan con `append`.","salida":"['30474035']"},{"t":"elige","q":"¿Por qué la función `ordenar` intercambia también las otras dos listas?","ops":["Para que cada nombre y cédula sigan con su apellido","Para ordenar las tres por separado","Porque si no da error"],"exp":"Si solo se ordenan los apellidos, las personas se mezclan.","code":null},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"x = \"Lopez\"\ny = \"Arias\"\nif x > y:\n    x, y = y, x\nprint(x, y)","ops":["Lopez Arias","Arias Arias","Lopez Lopez"],"exp":"`\"Lopez\" > \"Arias\"` es verdad (L va después de A), así que se intercambian.","correcta":"Arias Lopez"},{"t":"elige","q":"En `a, b, c = ordenar(cedulas, apellidos, nombres)`, ¿por qué queda ordenado?","ops":["Por cédula, porque es la primera lista","Por apellido","Por nombre"],"exp":"La función compara la primera lista que recibe.","code":null},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(\"Eva\".ljust(5) + \"|\" + \"Luis\".ljust(5) + \"|\")","ops":["Eva|Luis|","Eva |Luis |","  Eva| Luis|"],"exp":"Cada texto se rellena con espacios hasta 5.","correcta":"Eva  |Luis |"},{"t":"elige","q":"¿Para qué sirve el `\"\\n\"` en `m.write(\"listado\" + \"\\n\")`?","ops":["Para bajar a la línea siguiente","Para cerrar el archivo","Para borrar la línea"],"exp":"Es el salto de línea.","code":null}],"ejercicios":[{"id":"e1","titulo":"Leer el archivo completo","fuente":"Clase del 9-11","enunciado":"Crea el archivo alumnos.txt con el contenido de la lección 1 (en VS Code: archivo nuevo, pegas el texto y lo guardas con ese nombre en la misma carpeta del programa). Muestra cada línea sin el salto de línea, y si el archivo no se puede abrir, muestra «hubo problemas».","pista":"open con \"r\", readlines(), un for con print(linea.strip()) y close(). Todo dentro de try.","solucion":"try:\n    f = open(\"alumnos.txt\", \"r\")\n    lecturaArchivo = f.readlines()\n    for linea in lecturaArchivo:\n        print(linea.strip())\n    f.close()\nexcept:\n    print(\"hubo problemas\")","entrada":"","salida":"30474035,Perez,Gil,Ana,Maria,0790\n28999111,Arias,Mora,Luis,Jose,0760\n31000555,Lopez,Rey,Eva,Sofia,0790\n29555222,Diaz,Paz,Juan,Carlos,0790"},{"id":"e2","titulo":"Buscar una cédula","fuente":"Clase del 9-11","enunciado":"Pide una cédula y muestra el nombre, el apellido y el código de la materia de esa persona. Si no está, muestra «No está en el archivo».","pista":"Usa split(\",\") y compara con partes[0]. Usa una variable encontrado = False que cambie a True cuando la encuentres.","solucion":"cedula = input(\"Ingrese la cedula: \")\nencontrado = False\ntry:\n    f = open(\"alumnos.txt\", \"r\")\n    for linea in f.readlines():\n        partes = linea.strip().split(\",\")\n        if partes[0] == cedula:\n            print(partes[3], partes[4], partes[1], partes[2], \"- materia\", partes[5])\n            encontrado = True\n    f.close()\n    if not encontrado:\n        print(\"No está en el archivo\")\nexcept:\n    print(\"hubo problemas\")","entrada":"31000555","salida":"Ingrese la cedula: 31000555\nEva Sofia Lopez Rey - materia 0790"},{"id":"e3","titulo":"Lista de una materia, ordenada y guardada","fuente":"Clase del 11-11","enunciado":"Pide el código de una materia, busca a todos los que la inscribieron, ordénalos alfabéticamente por apellido, muéstralos en columnas y guarda la lista en listado.txt.","pista":"Es el programa de la clase: las 3 listas con append, la función ordenar, a, b, c = ordenar(apellidos, nombres, cedulas), un for con ljust y al final el archivo con \"w\".","solucion":"def ordenar(lista1, lista2, lista3):\n    for i in range(len(lista1) - 1):\n        for j in range(i + 1, len(lista1)):\n            if lista1[i] > lista1[j]:\n                lista1[i], lista1[j] = lista1[j], lista1[i]\n                lista2[i], lista2[j] = lista2[j], lista2[i]\n                lista3[i], lista3[j] = lista3[j], lista3[i]\n    return lista1, lista2, lista3\n\ncodigo = input(\"Dame el codigo de la asignatura: \")\ncedulas = []\nnombres = []\napellidos = []\ntry:\n    f = open(\"alumnos.txt\", \"r\")\n    for linea in f.readlines():\n        partes = linea.strip().split(\",\")\n        if partes[5][-4:] == codigo:\n            cedulas.append(partes[0])\n            nombres.append(partes[3] + \" \" + partes[4])\n            apellidos.append(partes[1] + \" \" + partes[2])\n    f.close()\n    a, b, c = ordenar(apellidos, nombres, cedulas)\n    for i in range(len(a)):\n        print(a[i].ljust(15), b[i].ljust(15), c[i])\n    m = open(\"listado.txt\", \"w\")\n    m.write(\"listado\" + \"\\n\")\n    m.write(\"codigo \" + codigo + \"\\n\")\n    for i in range(len(a)):\n        m.write(a[i].ljust(15) + b[i].ljust(15) + c[i] + \"\\n\")\n    m.close()\nexcept:\n    print(\"hubo problemas\")","entrada":"0790","salida":"Dame el codigo de la asignatura: 0790\nDiaz Paz        Juan Carlos     29555222\nLopez Rey       Eva Sofia       31000555\nPerez Gil       Ana Maria       30474035"}],"archivo":"30474035,Perez,Gil,Ana,Maria,0790\n28999111,Arias,Mora,Luis,Jose,0760\n31000555,Lopez,Rey,Eva,Sofia,0790\n29555222,Diaz,Paz,Juan,Carlos,0790\n"};
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const KW=new Set("def for in range if elif else return while import and or not True False None print len math random append sum round".split(" "));
function hl(src){
  let out="",i=0;const n=src.length;
  while(i<n){
    const c=src[i];
    if(c==="#"){let j=src.indexOf("\n",i);if(j<0)j=n;out+='<span class="c">'+esc(src.slice(i,j))+"</span>";i=j;continue;}
    if(c==='"'||c==="'"){let j=i+1;while(j<n&&src[j]!==c&&src[j]!=="\n")j++;j=Math.min(j+1,n);out+='<span class="s">'+esc(src.slice(i,j))+"</span>";i=j;continue;}
    if(/[0-9]/.test(c)&&!/[\w]/.test(src[i-1]||"")){let j=i;while(j<n&&/[0-9.e]/.test(src[j]))j++;out+='<span class="nu">'+src.slice(i,j)+"</span>";i=j;continue;}
    if(/[A-Za-z_]/.test(c)){let j=i;while(j<n&&/\w/.test(src[j]))j++;const w=src.slice(i,j);out+=KW.has(w)?'<span class="k">'+w+"</span>":esc(w);i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
const codigo=(src,solo)=>'<pre class="code'+(solo?" solo":"")+'"><code>'+hl(src)+"</code></pre>";
const salidaHTML=t=>'<div class="salida"><span class="lab">Salida</span><pre>'+esc(t)+"</pre></div>";
function barajar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------- matriz dibujada ---------- */
function dibujar(m,o){
  o=o||{};const filas=m.length,cols=m[0].length;
  const cls=o.cls||(()=>"");const bot=!!o.botones;
  let h='<div class="matriz" style="grid-template-columns:auto repeat('+cols+',auto)"'+(o.id?' id="'+o.id+'"':"")+(o.label?' role="group" aria-label="'+esc(o.label)+'"':"")+'>';
  h+='<span class="lbl"></span>';
  for(let j=0;j<cols;j++)h+=(o.colBtn?'<button type="button" class="lbl'+(o.colOn===j?" on":"")+'" data-col="'+j+'" aria-label="Columna '+j+'">':'<span class="lbl'+(o.colOn===j?" on":"")+'">')+j+(o.colBtn?"</button>":"</span>");
  for(let i=0;i<filas;i++){
    h+=(o.rowBtn?'<button type="button" class="lbl'+(o.rowOn===i?" on":"")+'" data-row="'+i+'" aria-label="Fila '+i+'">':'<span class="lbl'+(o.rowOn===i?" on":"")+'">')+i+(o.rowBtn?"</button>":"</span>");
    for(let j=0;j<cols;j++){
      const v=m[i][j];const c=cls(i,j);
      h+=bot?'<button type="button" class="celda '+c+'" data-i="'+i+'" data-j="'+j+'" aria-label="Fila '+i+', columna '+j+'">'+(v===null?"":v)+"</button>"
            :'<span class="celda '+c+'">'+(v===null?"":v)+"</span>";
    }
  }
  return h+"</div>";
}

/* ---------- preguntas (lecciones y examen) ---------- */
function pregunta(q,cont,alResponder){
  const box=document.createElement("div");box.className="preg";cont.appendChild(box);
  let hecho=false;
  const fin=(bien,extra)=>{
    hecho=true;
    const fb=document.createElement("div");fb.className="fb "+(bien?"ok":"bad");fb.setAttribute("role","status");
    fb.innerHTML="<h4>"+(bien?"Correcto":"No es así")+"</h4>"+(extra||"")+"<p>"+fmt(q.exp)+"</p>";
    box.appendChild(fb);
    if(alResponder)alResponder(bien,box);
  };
  const boton=()=>{const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="Comprobar";b.disabled=true;return b;};
  if(q.t==="elige"||q.t==="salida"){
    const todas=q.t==="salida"?[q.correcta].concat(q.ops):q.ops.slice();
    const orden=barajar(todas.map((_,i)=>i));
    box.innerHTML='<p class="q">'+fmt(q.q)+"</p>"+(q.usa?'<p class="usa">El código usa '+fmt(q.usa)+".</p>":"")+(q.code?codigo(q.code,true):"")+'<div class="ops'+(q.t==="salida"?" salidas":"")+'">'+orden.map(i=>'<button type="button" class="op-b" data-i="'+i+'" aria-pressed="false"><span class="v'+(q.t==="salida"?" mono":"")+'">'+(q.t==="salida"?esc(todas[i]):fmt(todas[i]))+"</span></button>").join("")+"</div>";
    let sel=null;const b=boton();box.appendChild(b);
    $$(".op-b",box).forEach(x=>x.addEventListener("click",()=>{if(hecho)return;$$(".op-b",box).forEach(y=>y.setAttribute("aria-pressed","false"));x.setAttribute("aria-pressed","true");sel=+x.dataset.i;b.disabled=false;}));
    b.addEventListener("click",()=>{
      const bien=sel===0;b.remove();
      $$(".op-b",box).forEach(x=>{x.disabled=true;const i=+x.dataset.i;if(i===0)x.classList.add("ok");else if(i===sel)x.classList.add("bad");});
      fin(bien,bien||q.t!=="elige"?"":"<p>La respuesta era: "+fmt(todas[0])+"</p>");
    });
  }else if(q.t==="completa"){
    const partes=q.code.split("___");const orden=barajar(q.ops.map((_,i)=>i));
    const pinta=v=>'<pre class="code solo"><code>'+hl(partes[0])+'<span class="hueco'+(v==null?" vacio":"")+'">'+(v==null?"___":esc(v))+"</span>"+hl(partes[1])+"</code></pre>";
    box.innerHTML='<p class="q">'+fmt(q.q)+'</p><div class="cod">'+pinta(null)+'</div><div class="fichas">'+orden.map(i=>'<button type="button" class="ficha" data-i="'+i+'" aria-pressed="false">'+esc(q.ops[i])+"</button>").join("")+"</div>";
    let sel=null;const b=boton();box.appendChild(b);
    $$(".ficha",box).forEach(x=>x.addEventListener("click",()=>{if(hecho)return;$$(".ficha",box).forEach(y=>y.setAttribute("aria-pressed","false"));x.setAttribute("aria-pressed","true");sel=+x.dataset.i;$(".cod",box).innerHTML=pinta(q.ops[sel]);b.disabled=false;}));
    b.addEventListener("click",()=>{
      const bien=sel===0;b.remove();$$(".ficha",box).forEach(x=>x.disabled=true);
      $(".cod",box).innerHTML=pinta(q.ops[0]);$(".hueco",box).classList.add(bien?"ok":"bad");
      fin(bien,(bien?"":"<p>Lo correcto es <code>"+esc(q.ops[0])+"</code>.</p>")+"<pre>"+esc(q.salida)+"</pre>");
    });
  }else if(q.t==="ordena"){
    const bl=q.lineas.map((l,i)=>({id:"s"+i,t:l[0],n:l[1]})).concat(q.trampas.map((t,i)=>({id:"t"+i,t:t[0],n:t[1],razon:t[2]})));
    const B=Object.fromEntries(bl.map(x=>[x.id,x]));
    let banco=barajar(bl.map(x=>x.id)),prog=[];
    box.innerHTML='<p class="q">'+fmt(q.q)+'</p><p style="font-size:.9rem;color:var(--muted)">Toca los bloques en orden. Cada uno ya trae su sangría. '+q.trampas.length+' bloques sobran.</p><span class="zona-t">Tu programa</span><div class="prog"></div><span class="zona-t">Bloques</span><div class="banco"></div>';
    const b=boton();box.appendChild(b);
    const blq=x=>'<button type="button" class="blq" data-b="'+x.id+'"><span class="ind" style="--n:'+x.n+'"></span><span class="bt">'+hl(x.t)+"</span></button>";
    function pinta(){
      $(".prog",box).innerHTML=prog.length?prog.map(id=>blq(B[id])).join(""):'<span class="vacio-t">Aquí se va armando el programa.</span>';
      $(".banco",box).innerHTML=banco.length?banco.map(id=>blq(B[id])).join(""):'<span class="vacio-t">No quedan bloques.</span>';
      $$(".prog .blq",box).forEach(x=>x.addEventListener("click",()=>{if(hecho)return;prog=prog.filter(y=>y!==x.dataset.b);banco.push(x.dataset.b);pinta();}));
      $$(".banco .blq",box).forEach(x=>x.addEventListener("click",()=>{if(hecho)return;banco=banco.filter(y=>y!==x.dataset.b);prog.push(x.dataset.b);pinta();}));
      b.disabled=prog.length===0;
    }
    pinta();
    b.addEventListener("click",()=>{
      b.remove();let bad=-1,msg="";
      for(let i=0;i<prog.length;i++){const x=B[prog[i]];if(x.razon){bad=i;msg="La línea "+(i+1)+" sobra. "+x.razon;break;}if(prog[i]!=="s"+i){bad=i;msg="La línea "+(i+1)+" no va ahí.";break;}}
      if(bad<0&&prog.length<q.lineas.length){bad=prog.length;msg="Faltan líneas.";}
      $$(".prog .blq",box).forEach((x,i)=>{if(bad<0)x.classList.add("ok");else if(i===bad)x.classList.add("bad");});
      const sol=q.lineas.map(l=>"    ".repeat(l[1])+l[0]).join("\n");
      fin(bad<0,(bad<0?"":"<p>"+fmt(msg)+"</p><pre>"+esc(sol)+"</pre>"));
    });
  }
  return box;
}

function ordenZigzag(n,m,modo){
  const o=[];
  if(modo==="zz2"){for(let i=0;i<Math.floor(n/2);i++){for(let j=0;j<m;j++)o.push([i,j]);for(let j=m-1;j>=0;j--)o.push([n-i-1,j]);}}
  else{for(let i=0;i<n;i+=2){for(let j=0;j<m;j++)o.push([i,j]);if(i+1!==n)for(let j=m-1;j>=0;j--)o.push([i+1,j]);}}
  return o;
}

function estad(M){
  const f=M.length,c=M[0].length;
  const pe=M.map(r=>r.reduce((a,b)=>a+b,0)/c);
  const pn=[],de=[];
  for(let j=0;j<c;j++){let s=0;for(let i=0;i<f;i++)s+=M[i][j];pn.push(s/f);let q=0;for(let i=0;i<f;i++)q+=(M[i][j]-pn[j])**2;de.push(Math.sqrt(q/(f-1)));}
  return {pe,pn,de};
}

function pyCorte(t,a,b){const n=t.length;const f=x=>x==null?null:(x<0?Math.max(0,n+x):Math.min(x,n));return t.slice(a==null?0:f(a),b==null?n:f(b));}
function rondaCorte(){
  const t=TEXTOS[rnd(0,TEXTOS.length-1)],n=t.length,tipo=rnd(0,4);let expr,res;
  if(tipo===0){const a=rnd(0,n-4),b=rnd(a+2,Math.min(n,a+6));expr="t["+a+":"+b+"]";res=t.slice(a,b);}
  else if(tipo===1){const b=rnd(2,Math.min(8,n-1));expr="t[:"+b+"]";res=t.slice(0,b);}
  else if(tipo===2){const a=rnd(Math.max(1,n-7),n-2);expr="t["+a+":]";res=t.slice(a);}
  else if(tipo===3){const k=rnd(2,5);expr="t[-"+k+":]";res=t.slice(n-k);}
  else{if(t.includes(",")){const p=t.split(",");const k=rnd(0,p.length-1);expr='t.split(",")['+k+"]";res=p[k];}else{expr="t[-1]";res=t[n-1];}}
  const ops=[res];const cand=[];
  for(let d=-2;d<=2;d++)for(let e=-2;e<=2;e++){if(tipo===0){const m=expr.match(/\[(\d+):(\d+)\]/);cand.push(t.slice(+m[1]+d,+m[2]+e));}}
  cand.push(res.slice(0,-1),res+t.charAt(t.indexOf(res)+res.length),t.slice(Math.max(0,t.indexOf(res)-1),t.indexOf(res)+res.length),res.slice(1),t.slice(0,res.length),t.slice(n-res.length-1));
  if(tipo===4&&t.includes(","))t.split(",").forEach(x=>cand.push(x));
  barajar(cand).forEach(c=>{if(c&&!ops.includes(c)&&ops.length<4)ops.push(c);});
  return {t,expr,res,ops};
}

    if(k>=E.length){
      const nota=Math.round(bien/E.length*20);S.examen={nota,bien,total:E.length};guardar();
      ex.innerHTML='<div class="final"><span class="grande">'+nota+'<small> / 20</small></span><p>'+bien+" de "+E.length+" correctas. "+(nota>=18?"Excelente: estás lista para el parcial.":nota>=14?"Bien. Repasa las que fallaste.":nota>=10?"Aprobado, pero repasa las lecciones de lo que fallaste.":"Repasa las lecciones y vuelve a intentarlo.")+"</p>"+
        (fallas.length?'<p><b>Para repasar:</b></p><ul style="margin:0;padding-left:1.15em">'+fallas.map(f=>"<li>"+fmt(f)+"</li>").join("")+"</ul>":"")+
        '<div class="fila-ctrl"><button type="button" class="btn" id="ex-otra">Repetir el examen</button><button type="button" class="btn sec" data-ir="aprende">Ir a las lecciones</button></div></div>';
      $("#ex-otra").addEventListener("click",correrExamen);ex.scrollIntoView({behavior:"smooth",block:"start"});return;
    }
    ex.innerHTML='<div class="juego"><div class="marcador"><span class="pill">Pregunta '+(k+1)+" de "+E.length+'</span><span class="pill esp">Correctas: '+bien+'</span></div><div class="barra"><i style="width:'+(k/E.length*100)+'%"></i></div><div id="ex-q" style="width:100%;display:grid"></div></div>';
    const q=E[k];
    pregunta(q,$("#ex-q"),(ok,box)=>{
      if(ok)bien++;else fallas.push(q.q==="¿Qué aparece en la pantalla?"?"Pregunta "+(k+1)+": predecir la salida de un código.":"Pregunta "+(k+1)+": "+q.q);
      const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=k+1<E.length?"Siguiente pregunta":"Ver mi nota";box.appendChild(b);b.focus({preventScroll:true});
      b.addEventListener("click",()=>{k++;una();ex.scrollIntoView({block:"start"});});
    });
  }
  una();
}

/* ---------- navegación ---------- */
const VISTAS=["aprende","juegos","examen"];
function ir(v){
  if(!VISTAS.includes(v))v="aprende";
  limpiar();
  $$(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.ir===v?"page":"false"));
  ({aprende:verAprende,juegos:verJuegos,examen:verExamen})[v]();
  try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);}catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ir]");if(!b)return;e.preventDefault();ir(b.dataset.ir);window.scrollTo({top:0});});
window.addEventListener("hashchange",()=>{const v=(location.hash||"").replace("#","");if(VISTAS.includes(v))ir(v);});
ir((location.hash||"").replace("#",""));
})();
</script>
